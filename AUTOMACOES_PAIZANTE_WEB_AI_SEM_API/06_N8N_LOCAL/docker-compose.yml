# n8n Community Edition, 100% local: bind apenas em 127.0.0.1:5678,
# sem VPS, sem dominio, sem API paga de IA dentro do workflow.
version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: paizante_n8n_local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://127.0.0.1:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-paizante}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-troque_esta_senha}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows_paizante:ro

volumes:
  n8n_data:
    name: paizante_n8n_data
