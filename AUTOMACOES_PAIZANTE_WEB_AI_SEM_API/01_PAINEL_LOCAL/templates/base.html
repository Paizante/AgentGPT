<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>{% block title %}Painel Local - Paizante{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

        <h1><a href="/">Painel Local - Automacoes Paizante Web AI</a></h1>

            <a href="/novo">Novo Trabalho</a>
